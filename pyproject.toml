[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nekoworker"
version = "0.1.0"
description = "Linux desktop containers with accessibility-first MCP control"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "mss>=10,<11", "Pillow>=11,<13", "uvicorn>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
nekoworker = "nekoworker.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

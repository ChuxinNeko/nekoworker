[supervisord]
nodaemon=true
logfile=/tmp/nekoworker-supervisord.log
pidfile=/tmp/nekoworker-supervisord.pid
childlogdir=/tmp

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_NEKO_RESOLUTION)sx24 -ac -nolisten tcp
priority=10
autorestart=true

[program:desktop]
command=sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec xfce4-session'
priority=20
autorestart=true
stopasgroup=true
killasgroup=true

[program:vnc]
command=sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec x11vnc -display :99 -rfbport 5900 -localhost -forever -shared -rfbauth /home/agent/.vnc/passwd'
priority=30
autorestart=true
stopasgroup=true
killasgroup=true

[program:novnc]
command=websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900
priority=40
autorestart=true

[program:mcp]
command=sh -c 'until xdpyinfo >/dev/null 2>&1; do sleep 0.2; done; exec nekoworker'
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
